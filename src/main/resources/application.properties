spring.application.name=IKSystem
spring.datasource.url=jdbc:postgresql://localhost:5432/IK_SYSTEM
spring.datasource.username=postgres
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.mail.host=smtp.izmit.bel.tr
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:sahte_mail@izmit.bel.tr}
app.hr.notification.email=${hr.notification.email:sahte_mail@izmit.bel.tr}

spring.mail.password=${EMAIL_PASSWORD:1234}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
